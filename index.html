<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>읽기 도우미 · 페이지온</title>
    <meta name="description" content="어려운 문장을 함께 읽고, 나만의 독서 기록을 남겨보세요." />
    <!-- Google Fonts & Pretendard -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- 상단 헤더 -->
      <header id="header-container"></header>

      <!-- 모바일 탭 내비게이션 (모바일에서만 노출) -->
      <nav id="mobile-nav" class="mobile-nav">
        <button class="mobile-tab-btn active" data-target="panel-book">책 내용</button>
        <button class="mobile-tab-btn" data-target="panel-chat">함께 읽기</button>
        <button class="mobile-tab-btn" data-target="panel-record">독서 기록</button>
      </nav>

      <!-- 글로벌 알림 / 에러 배너 -->
      <div id="alert-banner" class="alert-banner hidden"></div>

      <!-- 메인 3영역 작업공간 -->
      <main class="workspace-grid">
        <!-- 영역 1: 책 내용 패널 -->
        <section id="panel-book" class="panel-section panel-book active"></section>

        <!-- 영역 2: AI 독서 대화 패널 -->
        <section id="panel-chat" class="panel-section panel-chat"></section>

        <!-- 영역 3: 독서 기록 & TAO 로그 패널 -->
        <section id="panel-record" class="panel-section panel-record"></section>
      </main>

      <!-- 온보딩 모달 (학년 선택) -->
      <div id="onboarding-modal-container"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
